[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "precios-py"
version = "0.1.0"
description = "Motor de Web Scraping, Normalización EAN y Cálculo de Promociones Bancarias para Supermercados de Paraguay"
readme = "../ARQUITECTURA_PRECIOSPY.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "selectolax>=0.3.21",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

